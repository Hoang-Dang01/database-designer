<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Người Phụ Thuộc (DEPENDENT)</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Quay lại Bảng Điều Khiển</a>
        
        <header>
            <h2><i class="fa-solid fa-children"></i> Quản lý Người Phụ Thuộc (DEPENDENT)</h2>
        </header>

        <div class="card">
            <h3>Thêm Người Phụ Thuộc Mới</h3>
            <br>
            <form id="formDependent">
                <div class="form-group">
                    <label>Mã Người phụ thuộc (DependentID):</label>
                    <input type="number" name="DependentID" required>
                </div>
                <div class="form-group">
                    <label>Thuộc về Cư dân (MarsColonizationID):</label>
                    <!-- Tự động load danh sách cư dân -->
                    <select id="selectColonistID" name="MarsColonizationID" required></select>
                </div>
                <div class="form-group">
                    <label>Họ và Tên (Name):</label>
                    <input type="text" name="Name" required>
                </div>
                <div class="form-group">
                    <label>Ngày sinh (DateOfBirth):</label>
                    <input type="date" name="DateOfBirth" required>
                </div>
                <div class="form-group">
                    <label>Giới tính (Gender):</label>
                    <select name="Gender" required>
                        <option value="Male">Nam</option>
                        <option value="Female">Nữ</option>
                        <option value="Other">Khác</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Mối quan hệ (Relationship):</label>
                    <select name="Relationship" required>
                        <option value="Spouse">Vợ / Chồng (Spouse)</option>
                        <option value="Child">Con cái (Child)</option>
                        <option value="Parent">Cha mẹ (Parent)</option>
                    </select>
                </div>
                <button type="submit">Thêm DEPENDENT</button>
            </form>
        </div>

        <div class="card" style="overflow-x: auto;">
            <h3>Danh sách Người Phụ Thuộc</h3>
            <table id="tableDependent">
                <thead>
                    <tr>
                        <th>DependentID</th>
                        <th>MarsColonizationID (Cư dân)</th>
                        <th>Name</th>
                        <th>DOB</th>
                        <th>Gender</th>
                        <th>Relationship</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const formatColonist = (item) => `${item.MarsColonizationID} - ${item.Name}`;
            loadDropdown('colonists', 'selectColonistID', 'MarsColonizationID', formatColonist);

            const columns = ['DependentID', 'MarsColonizationID', 'Name', 'DateOfBirth', 'Gender', 'Relationship'];
            const reload = () => loadTable('dependents', 'tableDependent', columns, 'DependentID');
            reload();
            handleFormSubmit('formDependent', 'dependents', reload);
        });
    </script>
</body>
</html>
