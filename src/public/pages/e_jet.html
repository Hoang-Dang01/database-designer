<!DOCTYPE html>
<html lang="vi" data-theme="dark" data-lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Tàu Vũ Trụ (E_JET)</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="top-nav">
        <a href="../index.html" class="nav-home"><i class="fa-solid fa-rocket"></i> MARS</a>
        <a href="e_jet.html" class="active"><i class="fa-solid fa-space-shuttle"></i> E-JET</a>
        <a href="house.html"><i class="fa-solid fa-house-chimney"></i> HOUSE</a>
        <a href="job.html"><i class="fa-solid fa-briefcase"></i> JOB</a>
        <a href="pilot.html"><i class="fa-solid fa-user-astronaut"></i> PILOT</a>
        <a href="trip.html"><i class="fa-solid fa-route"></i> TRIP</a>
        <a href="colonist.html"><i class="fa-solid fa-users"></i> COLONIST</a>
        <a href="dependent.html"><i class="fa-solid fa-children"></i> DEPENDENT</a>
        <a href="work.html"><i class="fa-solid fa-clipboard-user"></i> WORK</a>
        <div class="nav-controls">
            <button class="btn-ctrl" onclick="let c=document.documentElement.getAttribute('data-lang');document.documentElement.setAttribute('data-lang',c==='vi'?'en':'vi')">
                <i class="fa-solid fa-language"></i>
                <span class="vi-text">VNI</span><span class="en-text">ENG</span>
            </button>
            <button class="btn-ctrl" onclick="let c=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',c==='dark'?'light':'dark')">
                <i class="fa-solid fa-circle-half-stroke"></i>
                <span class="vi-text">GIAO DIỆN</span><span class="en-text">THEME</span>
            </button>
        </div>
    </nav>
    <div class="container">
        <header>
            <h2><i class="fa-solid fa-space-shuttle"></i> <span data-vi="Quản lý Tàu Vũ Trụ" data-en="Spacecraft Management">Quản lý Tàu Vũ Trụ</span></h2>
        </header>
        <div class="card">
            <h3 data-vi="Thêm Tàu Vũ Trụ Mới" data-en="Add New Spacecraft">Thêm Tàu Vũ Trụ Mới</h3>
            <br>
            <form id="formEjet">
                <div class="form-group">
                    <label data-vi="Mã tàu:" data-en="Jet Code:">Mã tàu:</label>
                    <input type="text" name="JetCode" required>
                </div>
                <div class="form-group">
                    <label data-vi="Nguồn năng lượng:" data-en="Power Source:">Nguồn năng lượng:</label>
                    <input type="text" name="PowerSource" required>
                </div>
                <div class="form-group">
                    <label data-vi="Số ghế:" data-en="Number of Seats:">Số ghế:</label>
                    <input type="number" name="NumberOfSeat" required>
                </div>
                <div class="form-group">
                    <label data-vi="Trọng tải:" data-en="Weight:">Trọng tải:</label>
                    <input type="number" step="0.01" name="Weight" required>
                </div>
                <div class="form-group">
                    <label data-vi="Công suất hạt nhân:" data-en="Nuclear Engine Power:">Công suất hạt nhân:</label>
                    <input type="text" name="NuclearEnginePower">
                </div>
                <div class="form-group">
                    <label data-vi="Năm sản xuất:" data-en="Year Made:">Năm sản xuất:</label>
                    <input type="number" name="MadeYear" required>
                </div>
                <div class="form-group">
                    <label data-vi="Phân loại:" data-en="Jet Type:">Phân loại:</label>
                    <select name="JetType" required>
                        <option value="Passenger" data-vi="Chở khách" data-en="Passenger">Chở khách</option>
                        <option value="Cargo" data-vi="Chở hàng" data-en="Cargo">Chở hàng</option>
                        <option value="Military" data-vi="Quân sự" data-en="Military">Quân sự</option>
                    </select>
                </div>
                <button type="submit" data-vi="Thêm tàu mới" data-en="Add Spacecraft">Thêm tàu mới</button>
            </form>
        </div>
        <div class="card" style="overflow-x: auto;">
            <h3 data-vi="Danh sách Tàu Vũ Trụ" data-en="Spacecraft List">Danh sách Tàu Vũ Trụ</h3>
            <table id="tableEjet">
                <thead>
                    <tr>
                        <th data-vi="Mã tàu" data-en="Jet Code">Mã tàu</th>
                        <th data-vi="Nguồn NL" data-en="Power Source">Nguồn NL</th>
                        <th data-vi="Số ghế" data-en="Seats">Số ghế</th>
                        <th data-vi="Trọng tải" data-en="Weight">Trọng tải</th>
                        <th data-vi="Hạt nhân" data-en="Nuclear Power">Hạt nhân</th>
                        <th data-vi="Năm SX" data-en="Year">Năm SX</th>
                        <th data-vi="Loại" data-en="Type">Loại</th>
                        <th data-vi="Thao tác" data-en="Actions">Thao tác</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <script src="../js/i18n.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const columns = ['JetCode', 'PowerSource', 'NumberOfSeat', 'Weight', 'NuclearEnginePower', 'MadeYear', 'JetType'];
            const reload = () => loadTable('ejets', 'tableEjet', columns, 'JetCode');
            reload();
            handleFormSubmit('formEjet', 'ejets', reload);
        });
    </script>
</body>
</html>
