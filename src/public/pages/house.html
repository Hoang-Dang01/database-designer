<!DOCTYPE html>
<html lang="vi" data-theme="dark" data-lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Chỗ Ở (HOUSE)</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="top-nav">
        <a href="../index.html" class="nav-home"><i class="fa-solid fa-rocket"></i> MARS</a>
        <a href="e_jet.html"><i class="fa-solid fa-space-shuttle"></i> E-JET</a>
        <a href="house.html" class="active"><i class="fa-solid fa-house-chimney"></i> HOUSE</a>
        <a href="job.html"><i class="fa-solid fa-briefcase"></i> JOB</a>
        <a href="pilot.html"><i class="fa-solid fa-user-astronaut"></i> PILOT</a>
        <a href="trip.html"><i class="fa-solid fa-route"></i> TRIP</a>
        <a href="colonist.html"><i class="fa-solid fa-users"></i> COLONIST</a>
        <a href="dependent.html"><i class="fa-solid fa-children"></i> DEPENDENT</a>
        <a href="work.html"><i class="fa-solid fa-clipboard-user"></i> WORK</a>
        <div class="nav-controls">
            <button class="btn-ctrl" onclick="let c=document.documentElement.getAttribute('data-lang');document.documentElement.setAttribute('data-lang',c==='vi'?'en':'vi')">
                <i class="fa-solid fa-language"></i>
                <span class="vi-text">VNI</span><span class="en-text">ENG</span>
            </button>
            <button class="btn-ctrl" onclick="let c=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',c==='dark'?'light':'dark')">
                <i class="fa-solid fa-circle-half-stroke"></i>
                <span class="vi-text">GIAO DIỆN</span><span class="en-text">THEME</span>
            </button>
        </div>
    </nav>
    <div class="container">
        <header>
            <h2><i class="fa-solid fa-house-chimney"></i> <span data-vi="Quản lý Chỗ Ở" data-en="Housing Management">Quản lý Chỗ Ở</span></h2>
        </header>
        <div class="card">
            <h3 data-vi="Thêm Chỗ Ở Mới" data-en="Add New Housing">Thêm Chỗ Ở Mới</h3>
            <br>
            <form id="formHouse">
                <div class="form-group">
                    <label data-vi="Mã lô đất:" data-en="Lot Number:">Mã lô đất:</label>
                    <input type="text" name="LotNumber" required>
                </div>
                <div class="form-group">
                    <label data-vi="Số phòng:" data-en="Number of Rooms:">Số phòng:</label>
                    <input type="number" name="NumberOfRoom" required>
                </div>
                <div class="form-group">
                    <label data-vi="Diện tích (feet vuông):" data-en="Square Feet:">Diện tích (feet vuông):</label>
                    <input type="number" name="SquareFeet" required>
                </div>
                <button type="submit" data-vi="Thêm chỗ ở" data-en="Add Housing">Thêm chỗ ở</button>
            </form>
        </div>
        <div class="card" style="overflow-x: auto;">
            <h3 data-vi="Danh sách Chỗ Ở" data-en="Housing List">Danh sách Chỗ Ở</h3>
            <table id="tableHouse">
                <thead>
                    <tr>
                        <th data-vi="Mã lô đất" data-en="Lot Number">Mã lô đất</th>
                        <th data-vi="Số phòng" data-en="Rooms">Số phòng</th>
                        <th data-vi="Diện tích" data-en="Square Feet">Diện tích</th>
                        <th data-vi="Thao tác" data-en="Actions">Thao tác</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <script src="../js/i18n.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const columns = ['LotNumber', 'NumberOfRoom', 'SquareFeet'];
            const reload = () => loadTable('houses', 'tableHouse', columns, 'LotNumber');
            reload();
            handleFormSubmit('formHouse', 'houses', reload);
        });
    </script>
</body>
</html>
