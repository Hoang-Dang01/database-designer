<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Phi hành đoàn (PILOT)</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Quay lại Bảng Điều Khiển</a>
        
        <header>
            <h2><i class="fa-solid fa-user-astronaut"></i> Quản lý Phi Hành Đoàn (PILOT)</h2>
        </header>

        <div class="card">
            <h3>Thêm Phi Công Mới</h3>
            <br>
            <form id="formPilot">
                <div class="form-group">
                    <label>Mã Phi công (AstronomersID):</label>
                    <input type="number" name="AstronomersID" required>
                </div>
                <div class="form-group">
                    <label>Tên Phi công (Name):</label>
                    <input type="text" name="Name" required>
                </div>
                <div class="form-group">
                    <label>Cấp bậc (Rank):</label>
                    <select name="Rank" required>
                        <option value="Captain">Cơ trưởng (Captain)</option>
                        <option value="First Officer">Lái phụ (First Officer)</option>
                        <option value="Engineer">Kỹ sư (Engineer)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Số giờ bay vũ trụ (SpaceHours):</label>
                    <input type="number" name="SpaceHours" value="0">
                </div>
                <div class="form-group">
                    <label>Các Bằng Cấp (Qualifications - Phân cách bằng dấu phẩy):</label>
                    <input type="text" name="Qualifications" placeholder="VD: Bằng A, Bằng B...">
                </div>
                <div class="form-group">
                    <label>Phân công lái Tàu Vũ Trụ (JetCode):</label>
                    <!-- Sử dụng Dropdown để không phải nhập tay -->
                    <select id="selectJetCode" name="JetCode" required></select>
                </div>
                <button type="submit">Thêm PILOT</button>
            </form>
        </div>

        <div class="card" style="overflow-x: auto;">
            <h3>Danh sách Phi Công</h3>
            <table id="tablePilot">
                <thead>
                    <tr>
                        <th>AstronomersID</th>
                        <th>Name</th>
                        <th>Rank</th>
                        <th>Space Hours</th>
                        <th>Bằng Cấp (Từ bảng Đa trị)</th>
                        <th>JetCode (Tàu)</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Load dropdown mã tàu từ CSDL
            loadDropdown('ejets', 'selectJetCode', 'JetCode', 'JetType');

            const columns = ['AstronomersID', 'Name', 'Rank', 'SpaceHours', 'Qualifications', 'JetCode'];
            const reload = () => loadTable('pilots', 'tablePilot', columns, 'AstronomersID');
            reload();
            handleFormSubmit('formPilot', 'pilots', reload);
        });
    </script>
</body>
</html>
