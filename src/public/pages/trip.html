<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Chuyến Bay (TRIP)</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Quay lại Bảng Điều Khiển</a>
        
        <header>
            <h2><i class="fa-solid fa-route"></i> Quản lý Chuyến Bay (TRIP)</h2>
        </header>

        <div class="card">
            <h3>Thêm Chuyến Bay Mới</h3>
            <br>
            <form id="formTrip">
                <div class="form-group">
                    <label>Mã Chuyến bay (TripID):</label>
                    <input type="number" name="TripID" required>
                </div>
                <div class="form-group">
                    <label>Ngày phóng (LaunchDate):</label>
                    <input type="date" name="LaunchDate" required>
                </div>
                <div class="form-group">
                    <label>Ngày trở về dự kiến (ReturnDate):</label>
                    <input type="date" name="ReturnDate">
                </div>
                <div class="form-group">
                    <label>Tàu vũ trụ thực hiện (JetCode):</label>
                    <select id="selectJetCode" name="JetCode" required></select>
                </div>
                <button type="submit">Thêm TRIP</button>
            </form>
        </div>

        <div class="card" style="overflow-x: auto;">
            <h3>Danh sách Chuyến Bay</h3>
            <table id="tableTrip">
                <thead>
                    <tr>
                        <th>TripID</th>
                        <th>Launch Date</th>
                        <th>Return Date</th>
                        <th>JetCode (Tàu)</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Load dropdown mã tàu
            loadDropdown('ejets', 'selectJetCode', 'JetCode', 'JetType');

            const columns = ['TripID', 'LaunchDate', 'ReturnDate', 'JetCode'];
            const reload = () => loadTable('trips', 'tableTrip', columns, 'TripID');
            reload();
            handleFormSubmit('formTrip', 'trips', reload);
        });
    </script>
</body>
</html>
